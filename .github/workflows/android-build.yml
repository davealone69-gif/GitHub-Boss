name: Android build verification

on:
  push:
    branches:
      - main
      - repair/secure-gradle-signing-2026-11-06
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-build:
    name: Gradle configuration, tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle configuration and run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK metadata and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "Application ID:"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK"
          echo "APK SHA-256:"
          sha256sum "$APK"

      - name: Verify release signing fails closed without credentials
        shell: bash
        run: |
          set -euo pipefail
          if ./gradlew --no-daemon :app:assembleRelease > release-guard.log 2>&1; then
            echo "ERROR: release build unexpectedly succeeded without signing credentials."
            exit 1
          fi
          if ! grep -F "Release signing is blocked." release-guard.log; then
            cat release-guard.log
            echo "ERROR: release failed for a reason other than the signing guard."
            exit 1
          fi
          echo "PASS: release signing guard rejected missing credentials."

      - name: Upload debug APK and verification evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: github-boss-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            release-guard.log
          if-no-files-found: error
          retention-days: 14
