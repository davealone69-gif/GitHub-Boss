name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools'
        accept-android-sdk-licenses: true

    - name: Install required Android SDK packages
      shell: bash
      run: |
        set -euo pipefail
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

    - name: Setup Gradle 8.9
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
        validate-wrappers: false
        cache-read-only: false

    - name: Show Gradle version
      run: gradle --version

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace --no-daemon

    - name: Verify Debug APK
      shell: bash
      run: |
        set -euo pipefail
        APK="app/build/outputs/apk/debug/app-debug.apk"
        test -s "$APK"
        file "$APK"
        unzip -t "$APK" >/dev/null
        echo "APK SHA-256:"
        sha256sum "$APK"
        echo "APK size:"
        stat -c '%s bytes' "$APK"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 14

  publish-latest-apk:
    name: Publish latest APK download
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: release-apk
      - name: Stage direct APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find release-apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          mkdir -p release-assets
          cp "$apk" release-assets/latest-debug.apk
      - name: Publish latest debug APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}-${{ github.run_attempt }}
          name: Latest Android debug build #${{ github.run_number }}
          body: |
            Automated debug/test APK from commit ${{ github.sha }}.
            This is not a production-signed release.
          files: release-assets/latest-debug.apk
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
